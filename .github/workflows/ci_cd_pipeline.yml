name: Workflow Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
