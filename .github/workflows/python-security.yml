name: Python Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/python-security.yml'
      - '**.py'
      - 'requirements.txt'
      - '**.txt'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/python-security.yml'
      - '**.py'
      - 'requirements.txt'
      - '**.txt'
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

permissions:
  contents: read

jobs:
  bandit-scan:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude '.git/*,venv/*,node_modules/*,__pycache__/*,.venv/*,./apps/api/tests/*' \
            -f json \
            -o bandit-report.json

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  pip-audit:
    name: Pip Audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --strict -r apps/api/requirements.txt --format json --output pip-audit-report.json

      - name: Upload pip-audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  semgrep-scan:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --error --strict --config=auto \
            --config=p/python \
            --config=p/security-audit \
            --json \
            --output=semgrep-report.json \
            .

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30
