name: Secret Detection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full git history scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          config-path: .gitleaks.toml
          log-level: debug

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
              ;;
            schedule)
              BASE_SHA="$(git rev-parse HEAD~1)"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
            *)
              BASE_SHA="$(git rev-parse HEAD~1)"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "No diff to scan; skipping TruffleHog."
            exit 0
          fi

          docker run --rm \
            -v "$PWD:/pwd" \
            -w /pwd \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///pwd \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --fail=false \
            --no-update \
            --github-actions

  gitguardian:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitGuardian
        uses: GitGuardian/ggshield-action@main
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          args: scan repo . --recursive --exit-zero
        continue-on-error: true
