name: Secret Detection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Run Gitleaks over the complete commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            /tmp/gitleaks git --redact --config=.gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            /tmp/gitleaks git --redact --config=.gitleaks.toml --log-opts=--all .
          fi

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified TruffleHog
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.7/trufflehog_3.99.7_linux_amd64.tar.gz
          echo "bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef  /tmp/trufflehog.tar.gz" | sha256sum --check
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
      - name: Scan all detectors and adjudicate exact historical dev findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          args=(git "file://$PWD" --branch "$HEAD_SHA" --no-update --json --fail --fail-on-scan-errors)
          if [ -n "$BASE_SHA" ]; then
            args+=(--since-commit "$BASE_SHA")
          fi
          status=0
          /tmp/trufflehog "${args[@]}" > "$report" || status=$?
          python3 apps/api/scripts/check_trufflehog.py "$report" "$status"

  gitguardian:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Record optional scanner availability
        if: env.GITGUARDIAN_API_KEY == ''
        run: echo "GitGuardian not run; credential unavailable. No GitGuardian pass claimed." >> "$GITHUB_STEP_SUMMARY"

      - name: Run GitGuardian
        if: env.GITGUARDIAN_API_KEY != ''
        uses: GitGuardian/ggshield-action@10e9055712b4630c3d514ec16dca25c94b752b52 # master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
