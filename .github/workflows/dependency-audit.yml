name: Dependency Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/requirements.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/requirements.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
  schedule:
    - cron: '0 12 * * *'

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --strict -r requirements.txt

  osv:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o osv-scanner             https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: Scan repository
        run: ./osv-scanner scan source -r .

  dependabot:
    name: Dependabot configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dependabot configuration
        run: |
          test -f .github/dependabot.yml || test -f .github/dependabot.yaml

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
