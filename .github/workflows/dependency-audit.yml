name: Dependency Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'apps/api/requirements.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'apps/api/requirements.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --strict -r requirements.txt

  osv:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o osv-scanner             https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: Scan repository
        run: ./osv-scanner scan source -r .

  dependabot:
    name: Dependabot configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Dependabot configuration
        run: |
          test -f .github/dependabot.yml || test -f .github/dependabot.yaml

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record optional scanner availability
        if: env.SNYK_TOKEN == ''
        run: echo "Snyk not run; credential unavailable. No Snyk pass claimed." >> "$GITHUB_STEP_SUMMARY"
      - uses: snyk/actions/python@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=apps/api/requirements.txt --severity-threshold=high
