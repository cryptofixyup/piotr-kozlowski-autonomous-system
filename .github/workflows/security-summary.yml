name: Security Summary Report
on:
  workflow_run:
    workflows: ["Python Security Scan", "Secret Detection", "Dependency Audit", "CodeQL Analysis"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Report source run status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100
            });
            await core.summary.addHeading('Security workflow execution status')
              .addRaw('Execution status is not a vulnerability count or security certification.')
              .addTable([
                [{data:'Run',header:true},{data:'Commit',header:true},{data:'Conclusion',header:true}],
                [String(run.id), run.head_sha, run.conclusion || 'unknown']
              ])
              .addTable([
                [{data:'Job',header:true},{data:'Conclusion',header:true}],
                ...jobs.map(job => [job.name, job.conclusion || job.status])
              ]).write();
            if (run.conclusion !== 'success') core.setFailed('Source workflow did not succeed.');
