services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://autonomous:local-dev-only@postgres:5432/autonomous
    volumes: ["./apps/api/app:/app/app", "./services:/app/services", "./packages:/app/packages"]
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autonomous
      POSTGRES_USER: autonomous
      POSTGRES_PASSWORD: local-dev-only
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  postgres_data:
