services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autonomous
      POSTGRES_USER: autonomous
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomous -d autonomous"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://autonomous:local-dev-only@postgres:5432/autonomous
      MIGRATIONS_PATH: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.migrate"]

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autonomous:local-dev-only@postgres:5432/autonomous
      AUTONOMOUS_API_TOKEN: local-dev-token
      AUTONOMOUS_ACTOR_ID: local-dev
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7
    ports:
      - "6379:6379"
