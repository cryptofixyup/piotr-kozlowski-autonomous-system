services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api/app:/app/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autonomous
      POSTGRES_USER: autonomous
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
